function scene(){return `<div class="connection-scene" aria-label="SAP Business One and Produmex connected to a tailored web application"><div class="scene-halo"></div><p class="scene-caption">The systems you know. A better way to work.</p><svg class="scene-lines" viewBox="0 0 500 466" preserveAspectRatio="none" aria-hidden="true"><path class="wire" d="M100 157v36q0 22 22 22h107q21 0 21 21v28M400 157v36q0 22-22 22H271q-21 0-21 21v28"/><path class="wire moving" d="M100 157v36q0 22 22 22h107q21 0 21 21v28M400 157v36q0 22-22 22H271q-21 0-21 21v28"/><circle cx="250" cy="215" r="4" fill="#4a6481"/></svg><div class="system-node sap"><span class="node-mark">SAP</span><div><strong>SAP Business One</strong><small>Your business foundation</small></div></div><div class="system-node pmx"><span class="node-mark">${icon('layers')}</span><div><strong>Produmex WMS</strong><small>Your warehouse operations</small></div></div><div class="application-node"><div class="app-node-title">${icon('grid')}<div><strong>Built around your workflow</strong><small>Connected web applications</small></div></div><div class="app-node-row">Quality control & batch release ${icon('check')}</div><div class="app-node-row">The functionality you’re missing ${icon('check')}</div></div><p class="scene-footnote">One connected workflow. Built to fit.</p></div>`}
let appCounter=0;
function sampleApp(){const id='sample-'+(++appCounter);return `<div class="sample-app" data-sample="${id}"><div class="app-top"><div class="app-brand">${icon('flask')} OuterForge <span class="muted" style="font:12px var(--body);margin-left:3px">Quality</span></div><span class="avatar">JD</span></div><div class="app-main"><p class="crumb">Quality control / Batches / QC-0264</p><div class="batch-title"><h4>Herb seasoning blend</h4><span class="pill amber" data-batch-status>Awaiting review</span></div><p class="batch-subtitle">Batch B-260914 · Sample S-0264</p><div class="app-tabs" role="tablist" aria-label="Illustrative batch details"><button role="tab" aria-selected="true" data-tab="results" aria-controls="${id}-panel">Test results</button><button role="tab" aria-selected="false" data-tab="sample" aria-controls="${id}-panel">Sample</button><button role="tab" aria-selected="false" data-tab="certificate" aria-controls="${id}-panel">Certificate</button></div><div id="${id}-panel" class="app-tab-content" role="tabpanel" aria-label="Test results">${results()}</div></div><div class="app-bottom"><p>${icon('link')}<span data-stock-status>PMX stock: on hold</span></p><button data-release>Preview batch release</button></div></div>`}
function results(){return `<table class="result-table"><thead><tr><th>Test</th><th>Result</th><th>Assessment</th></tr></thead><tbody><tr><td>Appearance</td><td>Conforms</td><td><span class="pill green">Passed</span></td></tr><tr><td>Moisture</td><td>4.2%</td><td><span class="pill green">Passed</span></td></tr><tr><td>pH</td><td>6.1</td><td><span class="pill green">Passed</span></td></tr></tbody></table>`}

function qcFeature(){return `<section class="section" id="quality"><div class="wrap feature-grid"><div class="feature-copy"><div class="section-note">A connected quality workflow</div><h2>From the lab<br>to released stock.</h2><p>Your samples, test results and batch decisions belong together. Bring them into one web application connected to SAP and Produmex.</p><ul><li>${icon('check')} Samples and results in context</li><li>${icon('check')} Certificates tied to the right batch</li><li>${icon('check')} Accepted-batch release connected to PMX</li></ul>${textLink('Explore quality control','qc')}</div><div class="feature-bg">${sampleApp()}${demoCaption}</div></div></section>`}
const services=[['code','Applications that fit','A focused web application shaped around your people, processes and the work your existing software leaves uncovered.','custom'],['link','Systems that connect','Connect the application to SAP Business One and Produmex, so your workflow can use the data already there.','integration'],['flask','Quality that flows','Samples, results, certificates and batch release brought together in a connected QC workflow.','qc']];
function serviceSection(compact=false){return `<section class="${compact?'b-services':'section service-area'}" id="solutions"><div class="wrap">${compact?'':`<div class="section-head"><h2>Build what’s missing.<br>Connect what matters.</h2><p>Practical software for the space between your systems and the way you work.</p></div>`}<div class="service-list">${services.map(([i,t,p,m])=>`<article class="service"><div class="service-icon">${icon(i)}</div><div><h3>${t}</h3><p>${p}</p>${compact?'':textLink('Find out more',m)}</div></article>`).join('')}</div></div></section>`}
function studio(){return `<section class="section studio-section" id="about"><div class="wrap studio-grid"><div class="portrait-block"><img src="${PORTRAIT}" alt="Tom Bernaerd" loading="lazy" width="450" height="450"></div><div class="studio-copy"><div class="section-note">A small studio. Direct involvement.</div><h2>The person who understands it.<br>The person who builds it.</h2><p>I’m Tom. I work where business processes meet software, with hands-on experience in SAP Business One, Produmex WMS and the details that make an integration work.</p><p>Outer Join brings that experience into focused applications built around your business.</p><div class="signature"><span class="line"></span><div><strong>Tom Bernaerd</strong><small>Outer Join · Belgium</small></div></div></div></div></section>`}
const articles=[{tag:'SAP & warehouse operations',title:'Don’t disable the Produmex Transaction Notification!',description:'Why a small database change can have a big impact on warehouse integrity.',url:'https://outerjoin.be/posts/dont-disable-the-pmx-transaction-notification/',body:'The Produmex Transaction Notification is part of the consistency checks between SAP Business One and the WMS. Disabling it can allow changes that break the relationship between the two systems.',sub:'Understand the connection before changing it',detail:'Troubleshooting an integration starts with understanding which system owns which decision. The original article walks through the practical consequences of bypassing these checks.'},{tag:'Produmex WMS',title:'Produmex WMS licensing explained',description:'A practical guide to the licenses behind your warehouse operations.',url:'https://outerjoin.be/posts/produmex-wms-licensing-explained/',body:'Produmex licensing is one of the practical details behind a working warehouse environment. This technical note explains the relevant concepts and where to find the configuration.',sub:'Experience in the operational details',detail:'The full article covers the actual WMS configuration, with screenshots and examples from the published technical blog.'},{tag:'Tools & development',title:'How I use AI tools',description:'A look inside the tools and habits behind my development work.',url:'https://outerjoin.be/posts/how-i-use-ai-tools-june-2026/',body:'A snapshot of the tools I use for software development and implementation work, including coding agents, skills and reusable workflows.',sub:'A working practice, explained',detail:'Read the original June 2026 article for the detailed examples. This prototype shows how technical writing could sit within the new studio website.'}];

function variantA(){return `${header()}<main id="main"><section class="hero-a wrap"><div><div class="section-note"><span class="tiny-dot"></span> Independent software studio</div><h1>The missing piece<br>in your business<br>software.</h1><p class="intro">Bespoke web applications that connect to the systems you already run. Built around the way you work.</p><div class="actions">${button('Discuss your workflow','contact')}${textLink('Meet OuterForge','platform')}</div><p class="understatement">SAP Business One · Produmex WMS · Connected applications</p></div>${scene()}</section>${expertise()}${qcFeature()}${serviceSection()}${studio()}${insights()}${closing()}</main>`}
function variantB(){return `${header()}<main id="main"><section class="hero-b"><div class="wrap"><div class="hero-intro"><div class="section-note"><span class="tiny-dot"></span> Built by Outer Join. Connected to your business.</div><h1>Better workflows.<br>Built into your world.</h1><p>Bring the work around your ERP into focus, with integrated applications shaped around your business.</p><div class="actions">${button('Explore quality control','qc')}${button('Discuss a workflow','contact',true)}</div></div><div class="product-stage"><div class="product-aside"><h3>OuterForge Quality</h3><div class="side-item">${icon('flask')} Quality control</div><div class="side-item">${icon('layers')} Batches</div><div class="side-item">${icon('document')} Certificates</div><p style="margin-top:27px">From the first sample to an accepted batch.<br><br>Connected to SAP Business One and Produmex WMS.</p></div><div>${sampleApp()}${demoCaption}</div></div></div></section>${serviceSection(true)}<section class="section b-feature" id="quality"><div class="wrap platform-story">${scene()}<div><div class="section-note">The foundation behind the application</div><h2>Your systems.<br>Your workflow.<br>Connected.</h2><p>OuterForge brings together the connections and building blocks for bespoke web applications. QC is the first application. Your missing workflow could be next.</p>${textLink('Meet OuterForge','platform')}</div></div></section>${studio()}${insights()}${closing()}</main>`}
function variantC(){return `<div class="layout-c"><aside class="rail"><a href="#" data-home aria-label="Outer Join home"><img class="logo" src="${LOGO}" alt="Outer Join"></a><nav class="rail-nav" aria-label="Main navigation"><a class="rail-current" href="#main">The studio</a><a href="#solutions">What we build</a><a href="#platform" data-modal="platform">OuterForge</a><a href="#insights">Insights</a><a href="#contact" data-modal="contact">Get in touch</a></nav><div class="rail-bottom">Independent development.<br>Integrated thinking.<br>Based in Belgium.<a href="mailto:tom@outerjoin.be">tom@outerjoin.be</a></div></aside><main id="main" class="c-main"><div class="wrap"><div class="c-topline"><span>Business software, thoughtfully connected.</span><a href="#about">Meet Tom ${'↗'}</a></div><section class="hero-c"><h1>Software built to fit.<br>Systems made<br>to connect.</h1><div class="hero-description"><p>Outer Join is an independent studio building the applications your business needs, around the systems it already has.</p><div class="actions">${button('Let’s talk','contact')}</div></div></section><section id="solutions"><div class="work-title"><h2>Where we can help</h2><p>SAP Business One / Produmex / Web applications</p></div><article class="work-row"><div><div class="section-note">Quality control & batch release</div><h2>Connect the lab<br>and the warehouse.</h2><p>Samples, results and certificates, linked to the stock they belong to. An application for the full QC handoff.</p>${textLink('Explore the QC workflow','qc')}</div><div class="work-art">${sampleApp()}${demoCaption}</div></article><article class="work-row reverse"><div><div class="section-note">Bespoke integrated applications</div><h2>Build the piece<br>you’re missing.</h2><p>A focused application for a specific business process. Connected to your existing systems through the OuterForge foundation.</p>${textLink('Explore OuterForge','platform')}</div><div class="work-art">${scene()}</div></article></section></div>${studio()}${insights()}${closing()}</main></div>`}
const descriptions={A:'Connected studio. Split homepage with the integration story first.',B:'Product first. Centered promise and an interactive QC illustration.',C:'Studio portfolio. Persistent navigation and work presented as a portfolio.'};
let current='A';
function render(variant,push=false){current=['A','B','C'].includes(variant)?variant:'A';appCounter=0;document.getElementById('app').innerHTML=({A:variantA,B:variantB,C:variantC}[current])();document.body.dataset.variant=current;document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===current)));document.getElementById('variant-status').textContent=descriptions[current];document.title=`Outer Join | ${current} · ${descriptions[current].split('.')[0]}`;if(push){const u=new URL(location.href);u.searchParams.set('variant',current);u.hash='';history.pushState({variant:current},'',u)}window.scrollTo({top:0,behavior:'instant'});console.info('Prototype state',{variant:current,description:descriptions[current],backend:false});}
const modal=document.getElementById('details');
function openModal(kind){let content='';if(kind==='contact'){content=`<h2 id="modal-title">Let’s talk about your workflow.</h2><p>What do you need your systems to do? Tell me where the process gets awkward, what you use today, and what a better way of working would look like.</p><div class="signature"><img src="${PORTRAIT}" alt="Tom Bernaerd" style="width:65px;height:65px;border-radius:50%"><div><strong>Tom Bernaerd</strong><small>Outer Join · Belgium</small></div></div><div class="actions"><a class="button" href="mailto:tom@outerjoin.be?subject=Let%27s%20discuss%20a%20workflow">Email Tom ${icon('arrow')}</a><a class="text-link" href="https://www.linkedin.com/in/tbernaerd" target="_blank" rel="noopener">Connect on LinkedIn ${icon('arrow')}</a></div><p class="note">Prototype contact view. Email opens your mail app; nothing is submitted from this page.</p>`}else if(kind==='qc'){content=`<h2 id="modal-title">Quality control connected to your stock.</h2><p>Follow a batch from sample to result, certificate and accepted-batch release in one workflow linked to SAP Business One and Produmex.</p>${sampleApp()}${demoCaption}<h3>Built around the handoff</h3><ul><li>Keep sample records and test results together.</li><li>Find the quality evidence for a specific batch.</li><li>Connect accepted QC decisions to PMX stock release.</li></ul><p class="note">This is an illustrative interface, not the current product UI. The preview changes fictional browser state only. Rejection and reversal are not shown as automatic stock re-blocking.</p>${button('Arrange a guided demo','contact')}`}else if(kind==='platform'){content=`<h2 id="modal-title">Build on what already works.</h2><p>OuterForge is the foundation behind our integrated web applications: existing SAP Service Layer and PMX API connections, background jobs and the building blocks for your missing functionality.</p><h3>One foundation. Applications that fit.</h3><p>Start with a focused workflow. Use the connections your systems need. Shape the interface around the people doing the work.</p><ul><li>Connect to SAP Business One and Produmex.</li><li>Build bespoke web applications around your process.</li><li>Extend the foundation with further integrations over time.</li></ul><p class="note">OuterForge is the current naming candidate. QC and batch release is the first product being prepared for the market.</p><div class="actions">${button('See the QC example','qc')}${button('Discuss your application','contact',true)}</div>`}else if(kind==='custom'){content=`<h2 id="modal-title">An application around your process.</h2><p>When the work happens between spreadsheets, emails and your ERP, a focused web application can bring the workflow together.</p><h3>Start with the missing step</h3><p>We map the process, identify what belongs in your existing systems, and build the interface and functionality that complete the workflow.</p><p>Scope, integrations, deployment and ongoing support are agreed around the application.</p>${button('Discuss your workflow','contact')}`}else{content=`<h2 id="modal-title">Give your workflow a connection.</h2><p>Use the business data and operations already in SAP Business One and Produmex within an application built around your process.</p><h3>Integration with operational understanding</h3><p>Working connections need more than data movement. They need to respect how your stock, documents and business rules actually work.</p><p>Other software integrations can be assessed as part of a scoped application.</p>${button('Discuss an integration','contact')}`};document.getElementById('modal-content').innerHTML=content;if(!modal.open)modal.showModal();modal.scrollTop=0;}
function openArticle(i){const a=articles[i];document.getElementById('modal-content').innerHTML=`<p style="font-size:14px;color:var(--blue);margin-top:0">${a.tag}</p><h2 id="modal-title">${a.title}</h2><div class="article-excerpt"><p>${a.body}</p><h3>${a.sub}</h3><p>${a.detail}</p></div><p class="note">Article layout preview with a short summary. The original article remains on the live blog.</p><div class="actions"><a class="button" href="${a.url}" target="_blank" rel="noopener">Read the full article ${icon('arrow')}</a></div>`;modal.showModal();modal.scrollTop=0;}
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;if(t.dataset.variant){render(t.dataset.variant,true)}else if(t.dataset.cycle){const keys=['A','B','C'];render(keys[(keys.indexOf(current)+Number(t.dataset.cycle)+3)%3],true)}else if(t.hasAttribute('data-home')){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})}else if(t.dataset.modal){e.preventDefault();openModal(t.dataset.modal)}else if(t.dataset.article!==undefined){e.preventDefault();openArticle(Number(t.dataset.article))}else if(t.classList.contains('menu-toggle')){const nav=document.getElementById('mobile-nav');const open=nav.classList.toggle('open');t.setAttribute('aria-expanded',String(open));t.setAttribute('aria-label',open?'Close menu':'Open menu')}else if(t.dataset.tab){const box=t.closest('.sample-app');box.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===t)));const p=box.querySelector('.app-tab-content');p.setAttribute('aria-label',t.textContent);p.innerHTML=t.dataset.tab==='results'?results():t.dataset.tab==='sample'?`<dl class="sample-summary"><div><dt>Sample reference</dt><dd>S-0264</dd></div><div><dt>Batch reference</dt><dd>B-260914</dd></div><div><dt>Source</dt><dd>Incoming goods</dd></div><div><dt>Received</dt><dd>14 September 2026</dd></div></dl>`:`<div class="certificate">${icon('document')}<strong>Certificate of analysis</strong><p>Herb seasoning blend · Batch B-260914</p><p>Three results linked to sample S-0264</p></div>`}else if(t.hasAttribute('data-release')){const box=t.closest('.sample-app');const released=t.dataset.released==='true';t.dataset.released=String(!released);t.textContent=released?'Preview batch release':'Reset illustration';box.querySelector('[data-batch-status]').textContent=released?'Awaiting review':'Accepted';box.querySelector('[data-batch-status]').className=released?'pill amber':'pill green';box.querySelector('[data-stock-status]').textContent=released?'PMX stock: on hold':'PMX stock: released (example)';console.info('Fictional QC illustration',{released:!released,integration:false})}if(t.closest('.mobile-nav')){document.getElementById('mobile-nav').classList.remove('open');document.querySelector('.menu-toggle').setAttribute('aria-expanded','false')}});
document.getElementById('close-modal').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
document.addEventListener('keydown',e=>{if(modal.open||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable="true"],[role="tablist"]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const keys=['A','B','C'];render(keys[(keys.indexOf(current)+(e.key==='ArrowRight'?1:2))%3],true)}});
window.addEventListener('popstate',()=>render(new URLSearchParams(location.search).get('variant')));
render(new URLSearchParams(location.search).get('variant'));
